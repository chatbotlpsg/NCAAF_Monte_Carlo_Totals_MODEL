[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncaaf-aita-monte-totals"
version = "1.0.0"
description = "AITA NCAAF 2026 Monte Carlo totals pricing pipeline"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "tabulate>=0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ncaaf-aita = "ncaaf_aita.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
